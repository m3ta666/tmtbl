<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Timetable – Stages als Tabs, Tage als Zeilen</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --surface: #16161e;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0eff5;
    --muted: #888899;
    --accent: #c8f050;
    --accent2: #7c3aed;
    --danger: #ff4d6d;
    --stage-colors: #c8f050,#50e3c2,#f5a623,#ff6b9d,#a78bfa,#60a5fa,#fb923c,#34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  
  /* Tabs für Bühnen */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 2rem;
    overflow-x: auto;
  }
  .tab {
    padding: 0.75rem 1.25rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'DM Sans', sans-serif;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab-add, .tab-settings {
    color: var(--muted);
    font-size: 1.2rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.15s;
  }
  .tab-add:hover, .tab-settings:hover { color: var(--accent); }
  
  /* Controls */
  .controls {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 2rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .control-group { display: flex; align-items: center; gap: 0.5rem; }
  .control-group label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  
  input, select, textarea {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  
  .btn {
    padding: 0.45rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #0e0e12; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
  
  /* Timetable */
  .timetable-wrapper {
    overflow-x: auto;
    padding: 1.5rem 2rem;
    min-height: calc(100vh - 200px);
  }
  .timetable {
    display: grid;
    position: relative;
    min-width: 800px;
  }
  .timeline-header {
    display: flex;
    position: sticky;
    top: 60px;
    z-index: 50;
    background: var(--bg);
    padding-bottom: 4px;
    margin-bottom: 0;
  }
  .day-label-placeholder { flex-shrink: 0; }
  .timeline-ruler {
    flex: 1;
    position: relative;
    height: 36px;
    border-bottom: 1px solid var(--border2);
  }
  .tick {
    position: absolute;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
  }
  .tick-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .tick-line {
    width: 1px;
    height: 8px;
    background: var(--border2);
  }
  .tick.major .tick-line { height: 12px; background: var(--border2); }
  .tick.major .tick-label { color: var(--text); font-size: 0.72rem; }
  
  /* Day rows */
  .day-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .day-row { display: flex; align-items: stretch; min-height: 68px; }
  .day-label {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-right: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    gap: 6px;
  }
  .day-track {
    flex: 1;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    position: relative;
    overflow: visible;
    min-height: 68px;
  }
  .day-track-inner {
    position: absolute;
    inset: 0;
  }
  
  /* Act blocks (gleich) */
  .act-block {
    position: absolute;
    top: 6px;
    bottom: 6px;
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: grab;
    user-select: none;
    overflow: hidden;
    border: 1.5px solid rgba(0,0,0,0.2);
    transition: box-shadow 0.1s;
    min-width: 20px;
    z-index: 10;
  }
  .act-block:hover { box-shadow: 0 0 0 2px rgba(255,255,255,0.3); z-index: 20; }
  .act-block.dragging { opacity: 0.8; cursor: grabbing; z-index: 999; }
  .act-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(0,0,0,0.85);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act-time {
    font-size: 0.62rem;
    color: rgba(0,0,0,0.6);
    font-family: 'Space Mono', monospace;
  }
  .act-genre {
    font-size: 0.6rem;
    color: rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
  }
  .act-actions {
    position: absolute;
    top: 3px;
    right: 3px;
    display: none;
    gap: 2px;
  }
  .act-block:hover .act-actions { display: flex; }
  .act-action-btn {
    background: rgba(0,0,0,0.25);
    border: none;
    border-radius: 3px;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(0,0,0,0.8);
    font-size: 11px;
  }
  .act-action-btn:hover { background: rgba(0,0,0,0.4); }
  
  .empty-track {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--muted);
    pointer-events: none;
  }
  
  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 1.5rem;
    width: 420px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }
  .form-grid { display: flex; flex-direction: column; gap: 0.85rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
  .form-field label { font-size: 0.75rem; color: var(--muted); }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }
  
  /* Tage Manager */
  .day-manager {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin: 0 2rem 1rem;
  }
  .day-manager h3 {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
  }
  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .day-item input[type=text] { flex: 1; border: none; background: transparent; font-size: 0.82rem; }
  
  .tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-size: 0.78rem;
    pointer-events: none;
    z-index: 2000;
    max-width: 220px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip strong { display: block; margin-bottom: 4px; }
  .tt-row { display: flex; gap: 6px; color: var(--muted); margin-top: 2px; }
  .tt-row span:first-child { color: var(--text); min-width: 50px; }
  
  .export-area {
    background: var(--surface2);
    border-radius: 6px;
    padding: 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    max-height: 200px;
    overflow-y: auto;
  }
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); }
</style>
</head>
<body>

<header>
  <h1>◈ FESTIVAL TIMETABLE · STAGES AS TABS</h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openImportExport()">Import / Export</button>
    <button class="btn btn-primary btn-sm" onclick="openAddAct(null)">+ Act hinzufügen</button>
  </div>
</header>

<div class="tabs" id="stageTabs">
  <button class="tab-add" title="Bühne hinzufügen" onclick="addStage()">+</button>
  <button class="tab-settings" title="Tage verwalten" onclick="toggleDayManager()">📆 Tage</button>
</div>

<div class="controls" id="controlsBar">
  <div class="control-group">
    <label>Zeitstrahl von</label>
    <input type="time" id="timeStart" value="14:00" onchange="renderTimetable()">
  </div>
  <div class="control-group">
    <label>bis</label>
    <input type="time" id="timeEnd" value="06:00" onchange="renderTimetable()">
  </div>
  <div class="control-group" style="margin-left:auto;">
    <label id="totalHoursLabel"></label>
  </div>
</div>

<div id="dayManagerPanel" style="display:none;">
  <div class="day-manager">
    <h3>Tage verwalten</h3>
    <div class="day-list" id="dayList"></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="addDay()">+ Tag hinzufügen</button>
  </div>
</div>

<div class="timetable-wrapper" id="timetableWrapper">
  <div id="timetable" class="timetable"></div>
</div>

<!-- Act Modal -->
<div class="modal-backdrop hidden" id="actModal">
  <div class="modal">
    <h2 id="modalTitle">Act hinzufügen</h2>
    <div class="form-grid">
      <div class="form-field">
        <label>Name des Acts *</label>
        <input type="text" id="actName" placeholder="z.B. DJ Mafia">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Startzeit *</label>
          <input type="time" id="actStart" value="20:00">
        </div>
        <div class="form-field">
          <label>Länge (Minuten) *</label>
          <input type="number" id="actDuration" value="60" min="5" max="360" step="5">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Bühne *</label>
          <select id="actStage"></select>
        </div>
        <div class="form-field">
          <label>Tag *</label>
          <select id="actDay"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Genre</label>
          <input type="text" id="actGenre" placeholder="z.B. Techno">
        </div>
      </div>
      <div class="form-field">
        <label>Sonstiges</label>
        <textarea id="actNotes" placeholder="Notizen, Anforderungen..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-danger btn-sm" id="deleteBtn" style="display:none;" onclick="deleteCurrentAct()">Löschen</button>
      <button class="btn btn-primary" onclick="saveAct()">Speichern</button>
    </div>
  </div>
</div>

<!-- Import/Export Modal -->
<div class="modal-backdrop hidden" id="ieModal">
  <div class="modal">
    <h2>Import / Export</h2>
    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div><div class="section-title">Export (JSON)</div><div class="export-area" id="exportData"></div><button class="btn btn-ghost btn-sm" onclick="copyExport()">Kopieren</button></div>
      <div><div class="section-title">Import (JSON)</div><textarea id="importData" style="width:100%;height:80px;font-family:'Space Mono',monospace;"></textarea><button class="btn btn-primary btn-sm" onclick="importData()">Importieren</button></div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeIEModal()">Schließen</button></div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────
const STAGE_COLORS = ['#c8f050','#50e3c2','#f5a623','#ff6b9d','#a78bfa','#60a5fa','#fb923c','#34d399','#f472b6','#e879f9'];

let state = {
  stages: ['Hauptbühne', 'Floor B'],   // Tabs
  days: ['Tag 1', 'Tag 2'],            // Zeilen
  activeStage: 0,                      // Index der aktiven Bühne
  acts: [],                            // {id, stage, day, name, start, duration, genre, notes}
  timeStart: '14:00',
  timeEnd: '06:00',
};

let editingActId = null;
let dayManagerOpen = false;

// ─── Hilfsfunktionen ───────────────────────────────────────────────────
function timeToMinutes(t) { let [h,m]=t.split(':').map(Number); return h*60+m; }
function minutesToTime(mins) { let h=Math.floor((mins%1440+1440)%1440/60), m=(mins%1440+1440)%1440%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function getTotalMinutes() { let s=timeToMinutes(state.timeStart), e=timeToMinutes(state.timeEnd); if(e<=s) e+=1440; return e-s; }
function minutesToPercent(mins, startMins, totalMins) { return ((mins-startMins+1440)%1440)/totalMins*100; }
function save() { localStorage.setItem('ftimetable_rev', JSON.stringify(state)); }
function load() { let d = localStorage.getItem('ftimetable_rev'); if(d) try { let p=JSON.parse(d); state={...state,...p}; } catch(e){} }

// ─── Stages (Tabs) ────────────────────────────────────────────────────
function renderStageTabs() {
  let container = document.getElementById('stageTabs');
  let tabs = container.querySelectorAll('.tab');
  tabs.forEach(t => t.remove());
  state.stages.forEach((s, i) => {
    let btn = document.createElement('button');
    btn.className = 'tab' + (i === state.activeStage ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => { state.activeStage = i; renderStageTabs(); renderTimetable(); };
    btn.oncontextmenu = (e) => { e.preventDefault(); renameStage(i); };
    container.insertBefore(btn, container.querySelector('.tab-add'));
  });
}
function addStage() {
  let newName = 'Bühne ' + (state.stages.length+1);
  state.stages.push(newName);
  state.activeStage = state.stages.length-1;
  save(); renderStageTabs(); renderTimetable();
}
function renameStage(i) {
  let n = prompt('Bühne umbenennen:', state.stages[i]);
  if(n && n.trim()) { state.stages[i] = n.trim(); save(); renderStageTabs(); renderTimetable(); }
}
function removeStage(i) {
  if(!confirm(`Bühne "${state.stages[i]}" löschen? Alle Acts auf dieser Bühne werden gelöscht.`)) return;
  let stageName = state.stages[i];
  state.acts = state.acts.filter(a => a.stage !== stageName);
  state.stages.splice(i,1);
  if(state.activeStage >= state.stages.length) state.activeStage = Math.max(0, state.stages.length-1);
  save(); renderStageTabs(); renderTimetable();
}
// Kontextmenü für Tabs (Löschen)
document.addEventListener('contextmenu', e => { if(e.target.classList?.contains('tab')) e.preventDefault(); });
// Zusätzlich: Button zum Löschen von Bühnen in Tab-Leiste (optional – per Doppelklick)
function setupStageContext() {} // via oncontextmenu schon erledigt

// ─── Tage (Zeilen) Manager ────────────────────────────────────────────
function renderDayManager() {
  let list = document.getElementById('dayList');
  list.innerHTML = '';
  state.days.forEach((d, i) => {
    let row = document.createElement('div'); row.className = 'day-item';
    row.innerHTML = `
      <input type="text" value="${d}" onchange="renameDay(${i}, this.value)">
      <button class="btn btn-ghost btn-sm" onclick="removeDay(${i})" style="padding:2px 6px;">×</button>
    `;
    list.appendChild(row);
  });
}
function addDay() {
  state.days.push('Tag ' + (state.days.length+1));
  save(); renderDayManager(); renderTimetable();
}
function renameDay(i, val) { if(val.trim()) state.days[i]=val.trim(); save(); renderDayManager(); renderTimetable(); }
function removeDay(i) {
  if(!confirm(`Tag "${state.days[i]}" löschen? Alle Acts an diesem Tag werden gelöscht.`)) return;
  state.acts = state.acts.filter(a => a.day !== i);
  state.days.splice(i,1);
  save(); renderDayManager(); renderTimetable();
}
function toggleDayManager() {
  dayManagerOpen = !dayManagerOpen;
  document.getElementById('dayManagerPanel').style.display = dayManagerOpen ? 'block' : 'none';
  if(dayManagerOpen) renderDayManager();
}

// ─── Timetable Rendering (für aktive Bühne) ───────────────────────────
const LABEL_W = 110;
function renderTimetable() {
  state.timeStart = document.getElementById('timeStart').value;
  state.timeEnd = document.getElementById('timeEnd').value;
  let totalMins = getTotalMinutes();
  let h = Math.floor(totalMins/60), m = totalMins%60;
  document.getElementById('totalHoursLabel').textContent = `${h}h ${m>0 ? m+'min' : ''} Zeitstrahl`;

  let activeStageName = state.stages[state.activeStage];
  let container = document.getElementById('timetable');
  container.innerHTML = '';

  // Header mit Zeitraster
  let header = document.createElement('div'); header.className = 'timeline-header';
  let placeholder = document.createElement('div'); placeholder.className = 'day-label-placeholder'; placeholder.style.width = LABEL_W+'px';
  header.appendChild(placeholder);
  let ruler = document.createElement('div'); ruler.className = 'timeline-ruler';
  let startMins = timeToMinutes(state.timeStart);
  let total = getTotalMinutes();
  for(let t=0; t<=total; t+=30) {
    let pct = (t/total)*100;
    let tick = document.createElement('div'); tick.className = 'tick' + (t%60===0 ? ' major' : '');
    tick.style.left = pct+'%';
    let label = document.createElement('div'); label.className = 'tick-label'; label.textContent = minutesToTime(startMins+t);
    let line = document.createElement('div'); line.className = 'tick-line';
    tick.appendChild(label); tick.appendChild(line);
    ruler.appendChild(tick);
  }
  header.appendChild(ruler);
  container.appendChild(header);

  // Zeilen für jeden Tag
  let rowsDiv = document.createElement('div'); rowsDiv.className = 'day-rows';
  let dayActs = state.acts.filter(a => a.stage === activeStageName);
  
  state.days.forEach((dayName, dayIdx) => {
    let row = document.createElement('div'); row.className = 'day-row';
    let label = document.createElement('div'); label.className = 'day-label'; label.style.width = LABEL_W+'px';
    label.innerHTML = `<span style="font-weight:600;color:var(--accent);">${dayName}</span>`;
    row.appendChild(label);
    
    let track = document.createElement('div'); track.className = 'day-track';
    let inner = document.createElement('div'); inner.className = 'day-track-inner';
    
    let actsOnDay = dayActs.filter(a => a.day === dayIdx);
    if(actsOnDay.length === 0) {
      let empty = document.createElement('div'); empty.className = 'empty-track'; empty.textContent = 'Kein Act – klicke zum Hinzufügen';
      empty.style.cursor = 'pointer'; empty.onclick = () => openAddActForDay(dayIdx);
      inner.appendChild(empty);
    } else {
      actsOnDay.forEach(act => {
        let block = createActBlock(act, STAGE_COLORS[state.activeStage % STAGE_COLORS.length], startMins, totalMins);
        inner.appendChild(block);
      });
    }
    track.appendChild(inner);
    
    // Drop für Drag & Drop (Tag wechseln innerhalb gleicher Bühne)
    track.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    track.ondrop = e => {
      e.preventDefault();
      let id = e.dataTransfer.getData('actId');
      let act = state.acts.find(a => a.id == id);
      if(!act) return;
      let rect = track.getBoundingClientRect();
      let pct = (e.clientX - rect.left) / rect.width;
      let newStartMins = startMins + pct * total;
      newStartMins = Math.round(newStartMins / 5) * 5;
      act.start = minutesToTime(newStartMins);
      act.day = dayIdx;               // Tag wechseln
      act.stage = activeStageName;    // sicherheitshalber gleiche Bühne
      save(); renderTimetable();
    };
    row.appendChild(track);
    rowsDiv.appendChild(row);
  });
  container.appendChild(rowsDiv);
}

function createActBlock(act, color, startMins, totalMins) {
  let actStart = timeToMinutes(act.start);
  let relStart = actStart - startMins; if(relStart<0) relStart+=1440;
  let leftPct = (relStart/totalMins)*100;
  let widthPct = (act.duration/totalMins)*100;
  let block = document.createElement('div');
  block.className = 'act-block';
  block.style.left = leftPct+'%';
  block.style.width = Math.max(widthPct,1)+'%';
  block.style.background = color;
  block.draggable = true;
  block.innerHTML = `
    <div class="act-name">${act.name}</div>
    <div class="act-time">${act.start} · ${act.duration}min</div>
    ${act.genre ? `<div class="act-genre">${act.genre}</div>` : ''}
    <div class="act-actions"><button class="act-action-btn" onclick="editAct('${act.id}');event.stopPropagation();">✎</button></div>
  `;
  block.ondragstart = e => { e.dataTransfer.setData('actId', act.id); block.classList.add('dragging'); };
  block.ondragend = () => block.classList.remove('dragging');
  block.onmouseenter = e => showTooltip(e, act);
  block.onmousemove = e => moveTooltip(e);
  block.onmouseleave = hideTooltip;
  block.onclick = e => { if(!e.target.classList.contains('act-action-btn')) editAct(act.id); };
  
  // Resize Handle
  let handle = document.createElement('div');
  handle.style.cssText = 'position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:5;';
  handle.onmousedown = e => { e.stopPropagation(); startResize(e, act); };
  block.appendChild(handle);
  return block;
}

// Resize
let resizing = null;
function startResize(e, act) {
  e.preventDefault();
  let track = e.target.closest('.day-track');
  let rect = track.getBoundingClientRect();
  let totalMins = getTotalMinutes();
  resizing = { act, rect, totalMins };
  document.onmousemove = onResizeMove;
  document.onmouseup = stopResize;
}
function onResizeMove(e) {
  if(!resizing) return;
  let { act, rect, totalMins } = resizing;
  let startMins = timeToMinutes(state.timeStart);
  let actStartMins = timeToMinutes(act.start);
  let relStart = actStartMins - startMins; if(relStart<0) relStart+=1440;
  let pct = (e.clientX - rect.left) / rect.width;
  let endMins = pct * totalMins;
  let dur = Math.max(5, Math.round((endMins - relStart)/5)*5);
  act.duration = dur;
  renderTimetable();
}
function stopResize() { resizing = null; document.onmousemove = null; document.onmouseup = null; save(); }

// Tooltip
function showTooltip(e, act) {
  let tt = document.getElementById('tooltip');
  let end = minutesToTime(timeToMinutes(act.start)+act.duration);
  tt.innerHTML = `<strong>${act.name}</strong><div class="tt-row"><span>Zeit</span><span>${act.start} – ${end}</span></div><div class="tt-row"><span>Länge</span><span>${act.duration} min</span></div>${act.genre?`<div class="tt-row"><span>Genre</span><span>${act.genre}</span></div>`:''}${act.notes?`<div class="tt-row"><span>Notiz</span><span>${act.notes}</span></div>`:''}`;
  tt.classList.add('visible'); moveTooltip(e);
}
function moveTooltip(e) { let tt=document.getElementById('tooltip'); tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-10)+'px'; }
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

// ─── Act Modal ─────────────────────────────────────────────────────────
function openAddAct(dayIdx) {
  editingActId = null;
  document.getElementById('modalTitle').textContent = 'Act hinzufügen';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('actName').value = '';
  document.getElementById('actStart').value = '20:00';
  document.getElementById('actDuration').value = '60';
  document.getElementById('actGenre').value = '';
  document.getElementById('actNotes').value = '';
  fillStageSelect(state.stages[state.activeStage]);
  fillDaySelect(dayIdx !== undefined ? dayIdx : 0);
  document.getElementById('actModal').classList.remove('hidden');
}
function openAddActForDay(dayIdx) { openAddAct(dayIdx); }
function editAct(id) {
  let act = state.acts.find(a=>a.id==id);
  if(!act) return;
  editingActId = id;
  document.getElementById('modalTitle').textContent = 'Act bearbeiten';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('actName').value = act.name;
  document.getElementById('actStart').value = act.start;
  document.getElementById('actDuration').value = act.duration;
  document.getElementById('actGenre').value = act.genre||'';
  document.getElementById('actNotes').value = act.notes||'';
  fillStageSelect(act.stage);
  fillDaySelect(act.day);
  document.getElementById('actModal').classList.remove('hidden');
}
function fillStageSelect(selected) {
  let sel = document.getElementById('actStage');
  sel.innerHTML = state.stages.map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join('');
}
function fillDaySelect(selectedDayIdx) {
  let sel = document.getElementById('actDay');
  sel.innerHTML = state.days.map((d,i) => `<option value="${i}" ${i==selectedDayIdx?'selected':''}>${d}</option>`).join('');
}
function closeModal() { document.getElementById('actModal').classList.add('hidden'); }
function saveAct() {
  let name = document.getElementById('actName').value.trim();
  let start = document.getElementById('actStart').value;
  let duration = parseInt(document.getElementById('actDuration').value);
  let stage = document.getElementById('actStage').value;
  let day = parseInt(document.getElementById('actDay').value);
  let genre = document.getElementById('actGenre').value.trim();
  let notes = document.getElementById('actNotes').value.trim();
  if(!name || !start || isNaN(duration)) { alert('Bitte Name, Startzeit und Länge angeben.'); return; }
  if(editingActId) {
    let act = state.acts.find(a=>a.id==editingActId);
    if(act) { act.name=name; act.start=start; act.duration=duration; act.stage=stage; act.day=day; act.genre=genre; act.notes=notes; }
  } else {
    state.acts.push({ id: Date.now().toString(), stage, day, name, start, duration, genre, notes });
  }
  save(); closeModal(); renderTimetable();
}
function deleteCurrentAct() {
  if(!confirm('Act löschen?')) return;
  state.acts = state.acts.filter(a=>a.id!=editingActId);
  save(); closeModal(); renderTimetable();
}

// ─── Import / Export ───────────────────────────────────────────────────
function openImportExport() { document.getElementById('exportData').textContent = JSON.stringify(state, null, 2); document.getElementById('ieModal').classList.remove('hidden'); }
function closeIEModal() { document.getElementById('ieModal').classList.add('hidden'); }
function copyExport() { navigator.clipboard.writeText(document.getElementById('exportData').textContent).then(()=>alert('Kopiert!')); }
function importData() {
  try { let d = JSON.parse(document.getElementById('importData').value); if(!d.stages || !d.days || !d.acts) throw new Error(); state = {...state, ...d}; save(); closeIEModal(); renderStageTabs(); renderTimetable(); alert('Import erfolgreich!'); } catch(e) { alert('Fehler beim Import'); }
}

// ─── Init ──────────────────────────────────────────────────────────────
load();
document.getElementById('timeStart').value = state.timeStart;
document.getElementById('timeEnd').value = state.timeEnd;
renderStageTabs();
renderTimetable();
document.addEventListener('keydown', e => { if(e.key==='Escape') { closeModal(); closeIEModal(); } if(e.key==='n'&&(e.ctrlKey||e.metaKey)) { e.preventDefault(); openAddAct(null); } });
</script>
