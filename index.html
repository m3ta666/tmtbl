<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Festival Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --surface: #16161e;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0eff5;
    --muted: #888899;
    --accent: #c8f050;
    --accent2: #7c3aed;
    --danger: #ff4d6d;
    --stage-colors: #c8f050,#50e3c2,#f5a623,#ff6b9d,#a78bfa,#60a5fa,#fb923c,#34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* ── Header ─────────────────────────────── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  /* ── Tabs ────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 2rem;
    overflow-x: auto;
  }
  .tab {
    padding: 0.75rem 1.25rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'DM Sans', sans-serif;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab-add {
    color: var(--muted);
    font-size: 1.2rem;
    padding: 0.75rem 1rem;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.15s;
  }
  .tab-add:hover { color: var(--accent); }
  /* ── Controls bar ───────────────────────── */
  .controls {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 2rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .control-group { display: flex; align-items: center; gap: 0.5rem; }
  .control-group label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  input[type=time], input[type=text], input[type=number], select, textarea {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.82rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=time]:focus, input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  input[type=time] { font-family: 'Space Mono', monospace; }
  select option { background: var(--surface); }
  /* ── Buttons ────────────────────────────── */
  .btn {
    padding: 0.45rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #0e0e12; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text); }
  .btn-ghost:hover { border-color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
  /* ── Timetable area ─────────────────────── */
  .timetable-wrapper {
    overflow-x: auto;
    padding: 1.5rem 2rem;
    min-height: calc(100vh - 200px);
  }
  .timetable {
    display: grid;
    position: relative;
    min-width: 800px;
  }
  /* ── Timeline header ────────────────────── */
  .timeline-header {
    display: flex;
    position: sticky;
    top: 60px;
    z-index: 50;
    background: var(--bg);
    padding-bottom: 4px;
    margin-bottom: 0;
  }
  .stage-label-placeholder { flex-shrink: 0; }
  .timeline-ruler {
    flex: 1;
    position: relative;
    height: 36px;
    border-bottom: 1px solid var(--border2);
  }
  .tick {
    position: absolute;
    bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateX(-50%);
  }
  .tick-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .tick-line {
    width: 1px;
    height: 8px;
    background: var(--border2);
  }
  .tick.major .tick-line { height: 12px; background: var(--border2); }
  .tick.major .tick-label { color: var(--text); font-size: 0.72rem; }
  /* ── Stage rows ─────────────────────────── */
  .stage-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .stage-row { display: flex; align-items: stretch; min-height: 68px; }
  .stage-label {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding-right: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    writing-mode: horizontal-tb;
    white-space: nowrap;
    gap: 6px;
  }
  .stage-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .stage-track {
    flex: 1;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    position: relative;
    overflow: visible;
    min-height: 68px;
  }
  .stage-track-inner {
    position: absolute;
    inset: 0;
  }
  /* ── Act blocks ─────────────────────────── */
  .act-block {
    position: absolute;
    top: 6px;
    bottom: 6px;
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    cursor: grab;
    user-select: none;
    overflow: hidden;
    border: 1.5px solid rgba(0,0,0,0.2);
    transition: box-shadow 0.1s, opacity 0.1s;
    min-width: 20px;
    z-index: 10;
  }
  .act-block:hover { box-shadow: 0 0 0 2px rgba(255,255,255,0.3); z-index: 20; }
  .act-block.dragging { opacity: 0.8; cursor: grabbing; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .act-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(0,0,0,0.85);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .act-time {
    font-size: 0.62rem;
    color: rgba(0,0,0,0.6);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
  }
  .act-genre {
    font-size: 0.6rem;
    color: rgba(0,0,0,0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act-actions {
    position: absolute;
    top: 3px;
    right: 3px;
    display: none;
    gap: 2px;
  }
  .act-block:hover .act-actions { display: flex; }
  .act-action-btn {
    background: rgba(0,0,0,0.25);
    border: none;
    border-radius: 3px;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(0,0,0,0.8);
    font-size: 11px;
    padding: 0;
    font-family: 'DM Sans', sans-serif;
  }
  .act-action-btn:hover { background: rgba(0,0,0,0.4); }
  /* ── Now line ───────────────────────────── */
  .now-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--danger);
    z-index: 30;
    pointer-events: none;
  }
  .now-line::before {
    content: 'NOW';
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--danger);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }
  /* ── Empty state ────────────────────────── */
  .empty-track {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--muted);
    pointer-events: none;
  }
  /* ── Modal ──────────────────────────────── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 1.5rem;
    width: 420px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }
  .form-grid { display: flex; flex-direction: column; gap: 0.85rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
  .form-field label { font-size: 0.75rem; color: var(--muted); }
  .form-field input, .form-field select, .form-field textarea {
    width: 100%;
  }
  .form-field textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }
  /* ── Stage manager panel ────────────────── */
  .stage-manager {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin: 0 2rem 1rem;
  }
  .stage-manager h3 {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stage-list { display: flex; flex-direction: column; gap: 6px; }
  .stage-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .stage-item input[type=text] { flex: 1; border: none; background: transparent; font-size: 0.82rem; }
  /* ── Tooltip ────────────────────────────── */
  .tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-size: 0.78rem;
    pointer-events: none;
    z-index: 2000;
    max-width: 220px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .tooltip.visible { opacity: 1; }
  .tooltip strong { display: block; margin-bottom: 4px; font-size: 0.85rem; }
  .tooltip .tt-row { display: flex; gap: 6px; color: var(--muted); margin-top: 2px; }
  .tooltip .tt-row span:first-child { color: var(--text); min-width: 50px; }
  /* ── Export modal ───────────────────────── */
  .export-area {
    background: var(--surface2);
    border-radius: 6px;
    padding: 1rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    max-height: 200px;
    overflow-y: auto;
    word-break: break-all;
  }
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  /* ── Scrollbar ──────────────────────────── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>◈ FESTIVAL TIMETABLE</h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openImportExport()">Import / Export</button>
    <button class="btn btn-primary btn-sm" onclick="openAddAct(null)">+ Act hinzufügen</button>
  </div>
</header>

<div class="tabs" id="dayTabs">
  <button class="tab-add" title="Tag hinzufügen" onclick="addDay()">+</button>
</div>

<div class="controls" id="controlsBar">
  <div class="control-group">
    <label>Zeitstrahl von</label>
    <input type="time" id="timeStart" value="14:00" onchange="renderTimetable()">
  </div>
  <div class="control-group">
    <label>bis</label>
    <input type="time" id="timeEnd" value="06:00" onchange="renderTimetable()">
  </div>
  <div class="control-group">
    <label>Bühnen verwalten</label>
    <button class="btn btn-ghost btn-sm" onclick="toggleStageManager()">Bühnen ▾</button>
  </div>
  <div class="control-group" style="margin-left:auto;">
    <label style="font-size:0.75rem; color: var(--muted);" id="totalHoursLabel"></label>
  </div>
</div>

<div id="stageManagerPanel" style="display:none;">
  <div class="stage-manager">
    <h3>Bühnen</h3>
    <div class="stage-list" id="stageList"></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="addStage()">+ Bühne hinzufügen</button>
  </div>
</div>

<div class="timetable-wrapper" id="timetableWrapper">
  <div id="timetable" class="timetable"></div>
</div>

<!-- Act Modal -->
<div class="modal-backdrop hidden" id="actModal">
  <div class="modal">
    <h2 id="modalTitle">Act hinzufügen</h2>
    <div class="form-grid">
      <div class="form-field">
        <label>Name des Acts *</label>
        <input type="text" id="actName" placeholder="z.B. DJ Mafia">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Startzeit *</label>
          <input type="time" id="actStart" value="20:00">
        </div>
        <div class="form-field">
          <label>Länge (Minuten) *</label>
          <input type="number" id="actDuration" value="60" min="5" max="360" step="5">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Bühne *</label>
          <select id="actStage"></select>
        </div>
        <div class="form-field">
          <label>Genre</label>
          <input type="text" id="actGenre" placeholder="z.B. Techno">
        </div>
      </div>
      <div class="form-field">
        <label>Sonstiges</label>
        <textarea id="actNotes" placeholder="Notizen, Anforderungen..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-danger btn-sm" id="deleteBtn" style="display:none;" onclick="deleteCurrentAct()">Löschen</button>
      <button class="btn btn-primary" onclick="saveAct()">Speichern</button>
    </div>
  </div>
</div>

<!-- Import/Export Modal -->
<div class="modal-backdrop hidden" id="ieModal">
  <div class="modal">
    <h2>Import / Export</h2>
    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div>
        <div class="section-title">Export (JSON kopieren)</div>
        <div class="export-area" id="exportData"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="copyExport()">Kopieren</button>
      </div>
      <div>
        <div class="section-title">Import (JSON einfügen)</div>
        <textarea id="importData" style="width:100%;height:80px;font-family:'Space Mono',monospace;font-size:0.72rem;" placeholder='{"days":[...],"stages":[...],"acts":[...]}'></textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="importData()">Importieren</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeIEModal()">Schließen</button>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
const STAGE_COLORS = ['#c8f050','#50e3c2','#f5a623','#ff6b9d','#a78bfa','#60a5fa','#fb923c','#34d399','#f472b6','#e879f9'];

let state = {
  days: ['Tag 1'],
  activeDay: 0,
  stages: ['Hauptbühne', 'Floor B'],
  acts: [],  // {id, day, stage, name, start, duration, genre, notes}
  timeStart: '14:00',
  timeEnd: '06:00',
};

let editingActId = null;
let stageManagerOpen = false;

// ─── Time utilities ─────────────────────────────────────────────────────────
function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = Math.floor(((mins % 1440) + 1440) % 1440 / 60);
  const m = ((mins % 1440) + 1440) % 1440 % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function getTotalMinutes() {
  let s = timeToMinutes(state.timeStart);
  let e = timeToMinutes(state.timeEnd);
  if (e <= s) e += 1440;
  return e - s;
}
function minutesToPercent(mins, startMins, totalMins) {
  return ((mins - startMins + 1440) % 1440) / totalMins * 100;
}

// ─── Persist ────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('ftimetable', JSON.stringify(state));
}
function load() {
  const d = localStorage.getItem('ftimetable');
  if (d) try { state = {...state, ...JSON.parse(d)}; } catch(e){}
}

// ─── Days ───────────────────────────────────────────────────────────────────
function renderDayTabs() {
  const tabs = document.getElementById('dayTabs');
  const addBtn = tabs.querySelector('.tab-add');
  tabs.querySelectorAll('.tab').forEach(t => t.remove());
  state.days.forEach((day, i) => {
    const t = document.createElement('button');
    t.className = 'tab' + (i === state.activeDay ? ' active' : '');
    t.textContent = day;
    t.ondblclick = () => renameDay(i);
    t.onclick = () => { state.activeDay = i; renderDayTabs(); renderTimetable(); };
    tabs.insertBefore(t, addBtn);
  });
}
function addDay() {
  state.days.push('Tag ' + (state.days.length + 1));
  state.activeDay = state.days.length - 1;
  save(); renderDayTabs(); renderTimetable();
}
function renameDay(i) {
  const n = prompt('Tag umbenennen:', state.days[i]);
  if (n && n.trim()) { state.days[i] = n.trim(); save(); renderDayTabs(); }
}

// ─── Stages ─────────────────────────────────────────────────────────────────
function renderStageManager() {
  const list = document.getElementById('stageList');
  list.innerHTML = '';
  state.stages.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'stage-item';
    row.innerHTML = `
      <span class="stage-dot" style="background:${STAGE_COLORS[i % STAGE_COLORS.length]}"></span>
      <input type="text" value="${s}" onchange="renameStage(${i}, this.value)" style="border:none;background:transparent;font-size:0.82rem;color:var(--text);outline:none;flex:1;">
      <button class="btn btn-ghost btn-sm" onclick="removeStage(${i})" style="padding:2px 6px;font-size:0.7rem;">×</button>
    `;
    list.appendChild(row);
  });
}
function addStage() {
  state.stages.push('Bühne ' + (state.stages.length + 1));
  save(); renderStageManager(); renderTimetable();
}
function renameStage(i, v) {
  if (v.trim()) { state.stages[i] = v.trim(); save(); renderTimetable(); }
}
function removeStage(i) {
  if (!confirm('Bühne löschen? Alle Acts auf dieser Bühne werden ebenfalls gelöscht.')) return;
  const name = state.stages[i];
  state.acts = state.acts.filter(a => a.stage !== name);
  state.stages.splice(i, 1);
  save(); renderStageManager(); renderTimetable();
}
function toggleStageManager() {
  stageManagerOpen = !stageManagerOpen;
  document.getElementById('stageManagerPanel').style.display = stageManagerOpen ? 'block' : 'none';
  if (stageManagerOpen) renderStageManager();
}

// ─── Timetable render ────────────────────────────────────────────────────────
const LABEL_W = 110;

function renderTimetable() {
  state.timeStart = document.getElementById('timeStart').value;
  state.timeEnd = document.getElementById('timeEnd').value;
  const totalMins = getTotalMinutes();

  // Update label
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  document.getElementById('totalHoursLabel').textContent = `${h}h ${m > 0 ? m+'min' : ''} Zeitstrahl`;

  const tt = document.getElementById('timetable');
  tt.innerHTML = '';

  // Timeline header
  const header = document.createElement('div');
  header.className = 'timeline-header';
  const placeholder = document.createElement('div');
  placeholder.className = 'stage-label-placeholder';
  placeholder.style.width = LABEL_W + 'px';
  placeholder.style.flexShrink = '0';
  header.appendChild(placeholder);

  const ruler = document.createElement('div');
  ruler.className = 'timeline-ruler';

  // Generate ticks every 30min, major every 60min
  const startMins = timeToMinutes(state.timeStart);
  let t = 0;
  while (t <= totalMins) {
    const pct = (t / totalMins) * 100;
    const tick = document.createElement('div');
    tick.className = 'tick' + (t % 60 === 0 ? ' major' : '');
    tick.style.left = pct + '%';
    const absMin = (startMins + t);
    const label = document.createElement('div');
    label.className = 'tick-label';
    label.textContent = minutesToTime(absMin);
    const line = document.createElement('div');
    line.className = 'tick-line';
    tick.appendChild(label);
    tick.appendChild(line);
    ruler.appendChild(tick);
    t += 30;
  }
  header.appendChild(ruler);
  tt.appendChild(header);

  // Stage rows
  const rows = document.createElement('div');
  rows.className = 'stage-rows';

  const dayActs = state.acts.filter(a => a.day === state.activeDay);

  state.stages.forEach((stageName, si) => {
    const color = STAGE_COLORS[si % STAGE_COLORS.length];
    const row = document.createElement('div');
    row.className = 'stage-row';

    const label = document.createElement('div');
    label.className = 'stage-label';
    label.style.width = LABEL_W + 'px';
    label.innerHTML = `<span class="stage-dot" style="background:${color}"></span><span style="font-size:0.78rem;font-weight:600;color:${color};">${stageName}</span>`;
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'stage-track';
    const inner = document.createElement('div');
    inner.className = 'stage-track-inner';

    const stageActs = dayActs.filter(a => a.stage === stageName);

    if (stageActs.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-track';
      empty.textContent = 'Kein Act – klicke zum Hinzufügen';
      empty.onclick = () => openAddAct(stageName);
      empty.style.cursor = 'pointer';
      inner.appendChild(empty);
    }

    stageActs.forEach(act => {
      const block = createActBlock(act, color, startMins, totalMins);
      inner.appendChild(block);
    });

    track.appendChild(inner);

    // Drop zone for drag & drop
    track.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    track.ondrop = e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('actId');
      const act = state.acts.find(a => a.id == id);
      if (!act) return;
      const rect = track.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      let newStartMins = startMins + pct * totalMins;
      // Round to 5min
      newStartMins = Math.round(newStartMins / 5) * 5;
      act.start = minutesToTime(newStartMins);
      act.stage = stageName;
      act.day = state.activeDay;
      save(); renderTimetable();
    };

    row.appendChild(track);
    rows.appendChild(row);
  });

  tt.appendChild(rows);
}

function createActBlock(act, color, startMins, totalMins) {
  const actStartMins = timeToMinutes(act.start);
  let relStart = actStartMins - startMins;
  if (relStart < 0) relStart += 1440;
  const leftPct = (relStart / totalMins) * 100;
  const widthPct = (act.duration / totalMins) * 100;

  const block = document.createElement('div');
  block.className = 'act-block';
  block.style.left = leftPct + '%';
  block.style.width = Math.max(widthPct, 1) + '%';
  block.style.background = color;
  block.draggable = true;

  block.innerHTML = `
    <div class="act-name">${act.name}</div>
    <div class="act-time">${act.start} · ${act.duration}min</div>
    ${act.genre ? `<div class="act-genre">${act.genre}</div>` : ''}
    <div class="act-actions">
      <button class="act-action-btn" onclick="editAct('${act.id}');event.stopPropagation();" title="Bearbeiten">✎</button>
    </div>
  `;

  // Drag
  block.ondragstart = e => {
    e.dataTransfer.setData('actId', act.id);
    block.classList.add('dragging');
  };
  block.ondragend = () => block.classList.remove('dragging');

  // Tooltip
  block.onmouseenter = e => showTooltip(e, act);
  block.onmousemove = e => moveTooltip(e);
  block.onmouseleave = hideTooltip;

  // Click to edit
  block.onclick = e => {
    if (e.target.classList.contains('act-action-btn')) return;
    editAct(act.id);
  };

  // Resize handle
  const handle = document.createElement('div');
  handle.style.cssText = 'position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:5;';
  handle.onmousedown = e => { e.stopPropagation(); startResize(e, act); };
  block.appendChild(handle);

  return block;
}

// ─── Resize ──────────────────────────────────────────────────────────────────
let resizing = null;
function startResize(e, act) {
  e.preventDefault();
  const track = e.target.closest('.stage-track');
  const rect = track.getBoundingClientRect();
  const totalMins = getTotalMinutes();
  resizing = { act, rect, totalMins };
  document.onmousemove = onResizeMove;
  document.onmouseup = stopResize;
}
function onResizeMove(e) {
  if (!resizing) return;
  const { act, rect, totalMins } = resizing;
  const startMins = timeToMinutes(state.timeStart);
  const actStartMins = timeToMinutes(act.start);
  let relStart = actStartMins - startMins; if (relStart < 0) relStart += 1440;
  const pct = (e.clientX - rect.left) / rect.width;
  let endMins = pct * totalMins;
  let dur = Math.max(5, Math.round((endMins - relStart) / 5) * 5);
  act.duration = dur;
  renderTimetable();
}
function stopResize() {
  resizing = null;
  document.onmousemove = null;
  document.onmouseup = null;
  save();
}

// ─── Tooltip ─────────────────────────────────────────────────────────────────
function showTooltip(e, act) {
  const tt = document.getElementById('tooltip');
  const endMins = timeToMinutes(act.start) + act.duration;
  const endTime = minutesToTime(endMins);
  tt.innerHTML = `
    <strong>${act.name}</strong>
    <div class="tt-row"><span>Zeit</span><span>${act.start} – ${endTime}</span></div>
    <div class="tt-row"><span>Länge</span><span>${act.duration} min</span></div>
    ${act.genre ? `<div class="tt-row"><span>Genre</span><span>${act.genre}</span></div>` : ''}
    ${act.notes ? `<div class="tt-row"><span>Notiz</span><span>${act.notes}</span></div>` : ''}
  `;
  tt.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  tt.style.left = (e.clientX + 14) + 'px';
  tt.style.top = (e.clientY - 10) + 'px';
}
function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// ─── Modal ───────────────────────────────────────────────────────────────────
function openAddAct(stageName) {
  editingActId = null;
  document.getElementById('modalTitle').textContent = 'Act hinzufügen';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('actName').value = '';
  document.getElementById('actStart').value = '20:00';
  document.getElementById('actDuration').value = '60';
  document.getElementById('actGenre').value = '';
  document.getElementById('actNotes').value = '';
  fillStageSelect(stageName || state.stages[0]);
  document.getElementById('actModal').classList.remove('hidden');
  document.getElementById('actName').focus();
}
function editAct(id) {
  const act = state.acts.find(a => a.id == id);
  if (!act) return;
  editingActId = id;
  document.getElementById('modalTitle').textContent = 'Act bearbeiten';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('actName').value = act.name;
  document.getElementById('actStart').value = act.start;
  document.getElementById('actDuration').value = act.duration;
  document.getElementById('actGenre').value = act.genre || '';
  document.getElementById('actNotes').value = act.notes || '';
  fillStageSelect(act.stage);
  document.getElementById('actModal').classList.remove('hidden');
}
function fillStageSelect(selected) {
  const sel = document.getElementById('actStage');
  sel.innerHTML = state.stages.map(s =>
    `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`
  ).join('');
}
function closeModal() {
  document.getElementById('actModal').classList.add('hidden');
}
function saveAct() {
  const name = document.getElementById('actName').value.trim();
  const start = document.getElementById('actStart').value;
  const duration = parseInt(document.getElementById('actDuration').value);
  const stage = document.getElementById('actStage').value;
  const genre = document.getElementById('actGenre').value.trim();
  const notes = document.getElementById('actNotes').value.trim();
  if (!name || !start || isNaN(duration)) { alert('Bitte Name, Startzeit und Länge angeben.'); return; }
  if (editingActId) {
    const act = state.acts.find(a => a.id == editingActId);
    if (act) { act.name = name; act.start = start; act.duration = duration; act.stage = stage; act.genre = genre; act.notes = notes; act.day = state.activeDay; }
  } else {
    state.acts.push({ id: Date.now().toString(), day: state.activeDay, stage, name, start, duration, genre, notes });
  }
  save(); closeModal(); renderTimetable();
}
function deleteCurrentAct() {
  if (!confirm('Act löschen?')) return;
  state.acts = state.acts.filter(a => a.id != editingActId);
  save(); closeModal(); renderTimetable();
}

// ─── Import / Export ─────────────────────────────────────────────────────────
function openImportExport() {
  document.getElementById('exportData').textContent = JSON.stringify(state, null, 2);
  document.getElementById('ieModal').classList.remove('hidden');
}
function closeIEModal() { document.getElementById('ieModal').classList.add('hidden'); }
function copyExport() {
  navigator.clipboard.writeText(document.getElementById('exportData').textContent)
    .then(() => alert('In Zwischenablage kopiert!'));
}
function importData() {
  try {
    const d = JSON.parse(document.getElementById('importData').value);
    if (!d.days || !d.stages || !d.acts) throw new Error('Ungültiges Format');
    state = {...state, ...d};
    save(); closeIEModal();
    renderDayTabs(); renderTimetable();
    alert('Import erfolgreich!');
  } catch(e) { alert('Fehler beim Import: ' + e.message); }
}

// ─── Keyboard shortcut ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeIEModal(); }
  if (e.key === 'n' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openAddAct(null); }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
load();
document.getElementById('timeStart').value = state.timeStart || '14:00';
document.getElementById('timeEnd').value = state.timeEnd || '06:00';
renderDayTabs();
renderTimetable();
</script>
</body>
